appId: com.psum.pdfrename
productName: PDF Rename
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Utility
