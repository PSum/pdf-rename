appId: com.psum.pdfrename
productName: PDF Rename
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
publish:
  provider: github
  owner: PSum
  repo: pdf-rename
  releaseType: draft
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  # No Apple certificate: ad-hoc signature, so Apple Silicon Macs don't call the app "damaged".
  identity: '-'
  # Hardened runtime would reject Electron's own (differently signed) frameworks.
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: AppImage
  category: Utility
